<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e7e9ea;
      padding: 16px;
      text-align: center;
    }
    .logo { color: #1d9bf0; font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 12px; color: #71767b; margin-bottom: 14px; line-height: 1.5; }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 20px;
      background: #1d9bf0; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer;
    }
    button:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="logo">𝕏 Reader</div>
  <p>The control panel floats on the Twitter/X page.<br/>Use the button below to show it.</p>
  <button id="btn">Show Overlay</button>
  <script src="popup.js"></script>
</body>
</html>
