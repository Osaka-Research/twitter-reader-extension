name: Build & Release CRX

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install crx builder
        run: npm install -g crx3

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -e "console.log(require('./manifest.json').version)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Write private key
        run: |
          echo "${{ secrets.EXTENSION_PRIVATE_KEY }}" | base64 -d > key.pem

      - name: Build CRX
        run: |
          # Remove the key field from manifest before packing (Chrome adds it automatically)
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json'));
            delete m.key;
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2));
          "
          crx3 pack . --key-path key.pem --crx-path twitter-reader-extension.crx
          # Restore key field
          git checkout manifest.json

      - name: Update updates.xml version
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          sed -i "s/version='[^']*'/version='$VERSION'/" updates.xml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          git diff --staged --quiet || git commit -m "ci: bump updates.xml to v$VERSION [skip ci]"
          git push

      - name: Delete existing release tag
        run: |
          gh release delete "v${{ steps.ver.outputs.version }}" --yes 2>/dev/null || true
          git push --delete origin "v${{ steps.ver.outputs.version }}" 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Twitter Reader v${{ steps.ver.outputs.version }}
          body: |
            ## Install

            1. Download **twitter-reader-extension.crx** below
            2. Open `chrome://extensions` → enable **Developer Mode**
            3. Drag & drop the `.crx` file onto the page
            4. Chrome will auto-update this extension on future pushes automatically

            ## Extension ID
            `nbbpndkinhdhcdkhadiblapbfnbeficb`
          files: twitter-reader-extension.crx
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
